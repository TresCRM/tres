name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tres-crm
  HELM_RELEASE: tres-crm

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: ./apps/api/Dockerfile
          - service: web
            dockerfile: ./Dockerfile.web
          - service: workers
            dockerfile: ./Dockerfile.workers
    outputs:
      image-tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set kube context
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}

      - name: Deploy API to staging
        run: |
          helm upgrade --install ${HELM_RELEASE}-api ./infrastructure/helm/api \
            -f ./infrastructure/helm/values-staging.yaml \
            --set image.repository=${{ env.IMAGE_PREFIX }}/api \
            --set image.tag=${{ github.ref_name }} \
            --namespace tres-staging \
            --create-namespace \
            --wait --timeout 5m

      - name: Deploy Web to staging
        run: |
          helm upgrade --install ${HELM_RELEASE}-web ./infrastructure/helm/web \
            -f ./infrastructure/helm/values-staging.yaml \
            --set image.repository=${{ env.IMAGE_PREFIX }}/web \
            --set image.tag=${{ github.ref_name }} \
            --namespace tres-staging \
            --wait --timeout 5m

      - name: Deploy Workers to staging
        run: |
          helm upgrade --install ${HELM_RELEASE}-workers ./infrastructure/helm/workers \
            -f ./infrastructure/helm/values-staging.yaml \
            --set image.repository=${{ env.IMAGE_PREFIX }}/workers \
            --set image.tag=${{ github.ref_name }} \
            --namespace tres-staging \
            --wait --timeout 5m

      - name: Smoke test staging
        run: |
          echo "Waiting for pods to stabilize..."
          sleep 15
          STAGING_API="https://api.staging.tres-crm.com"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${STAGING_API}/healthz" --max-time 30 || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Staging health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Staging health check passed (HTTP $HTTP_CODE)"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production  # requires manual approval via GitHub environment protection rules
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set kube context
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}

      - name: Deploy API to production
        run: |
          helm upgrade --install ${HELM_RELEASE}-api ./infrastructure/helm/api \
            -f ./infrastructure/helm/values-production.yaml \
            --set image.repository=${{ env.IMAGE_PREFIX }}/api \
            --set image.tag=${{ github.ref_name }} \
            --namespace tres-production \
            --create-namespace \
            --wait --timeout 5m

      - name: Deploy Web to production
        run: |
          helm upgrade --install ${HELM_RELEASE}-web ./infrastructure/helm/web \
            -f ./infrastructure/helm/values-production.yaml \
            --set image.repository=${{ env.IMAGE_PREFIX }}/web \
            --set image.tag=${{ github.ref_name }} \
            --namespace tres-production \
            --wait --timeout 5m

      - name: Deploy Workers to production
        run: |
          helm upgrade --install ${HELM_RELEASE}-workers ./infrastructure/helm/workers \
            -f ./infrastructure/helm/values-production.yaml \
            --set image.repository=${{ env.IMAGE_PREFIX }}/workers \
            --set image.tag=${{ github.ref_name }} \
            --namespace tres-production \
            --wait --timeout 5m

      - name: Smoke test production
        run: |
          echo "Waiting for pods to stabilize..."
          sleep 15
          PROD_API="https://api.tres-crm.com"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${PROD_API}/healthz" --max-time 30 || echo "000")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Production health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Production health check passed (HTTP $HTTP_CODE)"
