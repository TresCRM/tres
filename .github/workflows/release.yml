name: Release (Tag)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Build Docs + Publish Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm version read from package.json "packageManager" field
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI + typed client
        run: |
          pnpm docs:gen
          pnpm docs:types

      - name: Upload OpenAPI
        uses: actions/upload-artifact@v4
        with:
          name: openapi-${{ github.ref_name }}.json
          path: apps/api/openapi.json
          retention-days: 90

      - name: Upload typed client
        uses: actions/upload-artifact@v4
        with:
          name: openapi-types-${{ github.ref_name }}
          path: packages/types/src/openapi.ts
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/api/openapi.json
            packages/types/src/openapi.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
