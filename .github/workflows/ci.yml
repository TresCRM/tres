name: CI (Test + Coverage + OpenAPI)

on:
  push:
    branches: ["**"]
    paths:
      - "apps/**"
      - "packages/**"
      - "jest.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/**"
      - "packages/**"
      - "jest.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit/Int/E2E + Coverage
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      SURVEY_JWT_SECRET: ci-survey-secret
      MONGO_URI: mongodb://localhost:27017/trescrm_ci
      SMTP_DEFAULT_HOST: localhost
      SMTP_DEFAULT_PORT: "1025"
      SMTP_DEFAULT_SECURE: "false"
      EMAILS_DISABLED: "1"
      DISABLE_RATE_LIMIT: "1"
      USE_MEMORY_MONGO: "1"
      EVENTS_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm MUST be set up BEFORE actions/setup-node so the cache works
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version is read from package.json "packageManager" field automatically

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Show tool versions
        run: |
          node -v
          pnpm -v

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run tests (all)
        run: |
          npx jest --passWithNoTests --runInBand --no-coverage --forceExit

      - name: Coverage (text + lcov)
        run: |
          npx jest --passWithNoTests --runInBand --forceExit --coverage --coverageReporters=text-summary,lcov
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      - name: Generate OpenAPI
        run: pnpm docs:gen
        continue-on-error: true

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: openapi.json
          path: apps/api/openapi.json
          if-no-files-found: warn
          retention-days: 14
