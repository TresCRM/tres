name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: false

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/trescrm_ci
      JWT_SECRET: ci-test-secret
      SURVEY_JWT_SECRET: ci-survey-secret
      SMTP_DEFAULT_HOST: localhost
      SMTP_DEFAULT_PORT: "1025"
      SMTP_DEFAULT_SECURE: "false"
      EMAILS_DISABLED: "1"
      DISABLE_RATE_LIMIT: "1"
      EVENTS_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm test
        working-directory: .

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter web build

      - name: Bundle size check
        run: |
          SIZE=$(du -sm apps/web/.next | cut -f1)
          echo "Web bundle size: ${SIZE}MB"
          if [ "$SIZE" -gt 200 ]; then
            echo "::warning::Web bundle size (${SIZE}MB) exceeds 200MB threshold"
          fi

  openapi-validation:
    name: OpenAPI Spec Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI spec generation
        run: pnpm docs:gen

  docker-build:
    name: Docker Build (no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            file: apps/api/Dockerfile
          - service: web
            file: Dockerfile.web
          - service: workers
            file: Dockerfile.workers
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          tags: tres-crm/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
