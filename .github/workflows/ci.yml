name: CI (Test • Coverage • OpenAPI)

on:
  push:
    branches: [ "**" ]
    paths:
      - "apps/**"
      - "packages/**"
      - "jest.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "**" ]
    paths:
      - "apps/**"
      - "packages/**"
      - "jest.config.ts"
      - "pnpm-lock.yaml"
      - ".github/workflows/ci.yml"

# Prevent multiple redundant runs per branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit/Int/E2E + Coverage
    runs-on: ubuntu-latest
    env:
      # Minimal env for tests/docs generation
      NODE_ENV: test
      JWT_SECRET: test-secret
      SMTP_DEFAULT_HOST: localhost
      SMTP_DEFAULT_PORT: "1025"
      SMTP_DEFAULT_SECURE: "false"
      EVENTS_URL: ""   # tests don't require NATS; you can wire it later
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm (10.17.1)
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Show tool versions
        run: |
          node -v
          pnpm -v

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck API (strict, no build)
        run: pnpm dlx tsc -p apps/api/tsconfig.json --noEmit

      # OPTIONAL: if/when you add a linter for API, enable this
      # - name: Lint API
      #   run: pnpm -C apps/api lint

      # Web lint is already wired in your scripts (keep if desired)
      # - name: Lint Web
      #   run: pnpm lint:web

      - name: Run tests (all)
        run: pnpm test

      - name: Coverage (text + lcov)
        run: pnpm coverage

      - name: Upload coverage artifact (lcov)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      # OPTIONAL: publish to Codecov (set CODECOV_TOKEN in repo secrets if needed)
      # - name: Upload to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
      #     files: coverage/lcov.info
      #     fail_ci_if_error: true

      - name: Generate OpenAPI (apps/api/openapi.json)
        run: pnpm docs:gen

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi.json
          path: apps/api/openapi.json
          if-no-files-found: error
          retention-days: 14

      # OPTIONAL: generate typed client from OpenAPI for the web app
      # - name: Generate TS client from OpenAPI
      #   run: pnpm docs:types
      #
      # - name: Upload generated client (packages/types/src/openapi.ts)
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: openapi-types
      #     path: packages/types/src/openapi.ts
      #     if-no-files-found: error
      #     retention-days: 14
