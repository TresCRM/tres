name: Docker (Build • Push)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

permissions:
  contents: read
  packages: write    # required to push to GHCR
  id-token: write    # for future OIDC integrations

env:
  REGISTRY: ghcr.io
  # Will be resolved to lowercase later for safety
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  docker:
    name: Build & Push ${{ matrix.app }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile
          - app: web
            context: ./apps/web
            dockerfile: ./apps/web/Dockerfile
          - app: workers
            context: ./apps/workers
            dockerfile: ./apps/workers/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image namespace
        id: img
        run: echo "name=$(echo '${{ env.IMAGE_NAMESPACE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.ref_type == 'tag' || github.ref_name == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OPTIONAL: sign images with cosign (supply COSIGN_KEY or use keyless)
      # - name: Cosign sign
      #   if: github.ref_name == 'main' || github.ref_type == 'tag'
      #   uses: sigstore/cosign-installer@v3
      # - run: cosign sign --yes ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}-${{ matrix.app }}@${{ steps.meta.outputs.digest }}

    # OPTIONAL: sample services (enable if your build/tests need them)
    # services:
    #   nats:
    #     image: nats:2
    #     ports: [ "4222:4222" ]
    #   mongo:
    #     image: mongo:7
    #     ports: [ "27017:27017" ]
