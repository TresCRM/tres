name: Security Audit (Dependencies)

on:
  push:
    branches: [main, rbac-implement]
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/*/package.json"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: pnpm audit (all)
        run: |
          echo "## Full Audit Report" >> $GITHUB_STEP_SUMMARY
          pnpm audit 2>&1 | tee audit-report.txt || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for critical/high vulnerabilities
        run: |
          CRITICAL=$(pnpm audit --json 2>/dev/null | jq '[.advisories // {} | to_entries[] | select(.value.severity == "critical")] | length' 2>/dev/null || echo "0")
          HIGH=$(pnpm audit --json 2>/dev/null | jq '[.advisories // {} | to_entries[] | select(.value.severity == "high")] | length' 2>/dev/null || echo "0")
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::error::$CRITICAL critical vulnerability(ies) found!"
            exit 1
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.txt
          retention-days: 30
