groups:
  - name: tres-crm
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API error rate > 5% for 5 minutes"
          description: "The API 5xx error rate has exceeded 5% of total requests for the last 5 minutes."

      - alert: HealthCheckFailing
        expr: up{job="tres-crm-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "TRES CRM API health check is failing"
          description: "The API target has been down for more than 2 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_ms_bucket[5m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API P99 latency > 2s for 5 minutes"
          description: "The 99th percentile request latency has exceeded 2000ms for the last 5 minutes."

      - alert: NATSDisconnected
        expr: nats_messages_failed_total > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NATS message failures detected"
          description: "NATS message failures have been observed for more than 10 minutes."
