## TRES CRM — NATS Server Configuration
## Docs: https://docs.nats.io/running-a-nats-service/configuration

port: 4222
http_port: 8222

jetstream {
  store_dir: /data/nats-storage
  max_mem: 256MB
  max_file: 1GB
}

# Auth (replace with real credentials in production)
authorization {
  default_permissions = {
    publish = ["ticket.>", "billing.>", "presence.>", "events.>"]
    subscribe = ["ticket.>", "billing.>", "presence.>", "events.>"]
  }
}
