# Secrets are managed externally via Azure Key Vault and Secrets Store CSI Driver.
# This SecretProviderClass mounts secrets from Azure Key Vault into Kubernetes Secrets.
#
# Prerequisites:
#   1. Install Secrets Store CSI Driver: https://secrets-store-csi-driver.sigs.k8s.io/
#   2. Install Azure Key Vault Provider: https://azure.github.io/secrets-store-csi-driver-provider-azure/
#   3. Configure workload identity or managed identity for the pod service account.
#
# The synced Kubernetes Secret (tres-crm-api-secrets) is referenced by the Deployment's envFrom.

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "tres-crm-api.fullname" . }}-secrets
  labels:
    {{- include "tres-crm-api.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "" # Set via Helm values or external config
    keyvaultName: "" # Set via Helm values or external config
    tenantId: "" # Set via Helm values or external config
    objects: |
      array:
        - |
          objectName: mongodb-connection-string
          objectType: secret
        - |
          objectName: nats-url
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: session-secret
          objectType: secret
        - |
          objectName: smtp-password
          objectType: secret
  secretObjects:
    - secretName: {{ .Values.secretRef.name }}
      type: Opaque
      data:
        - objectName: mongodb-connection-string
          key: MONGO_URI
        - objectName: nats-url
          key: NATS_URL
        - objectName: jwt-secret
          key: JWT_SECRET
        - objectName: session-secret
          key: SESSION_SECRET
        - objectName: smtp-password
          key: SMTP_PASSWORD
